<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Plutonium — Launcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap" />
<style>
  :root {
    --bg-0: #07070f;
    --bg-1: #0d0d1c;
    --bg-2: #131327;
    --bg-3: #1b1b34;
    --line: #24244a;
    --line-2: #2e2e5c;
    --ink: #e9e8ff;
    --ink-dim: #a0a0c8;
    --ink-mute: #6b6b94;
    --violet: #8a7bff;
    --violet-2: #6b5cff;
    --violet-soft: #b9b0ff;
    --violet-glow: rgba(138, 123, 255, 0.45);
    --good: #7af0a8;
    --warn: #ffd166;
    --bad: #ff6b8a;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    font-family: 'Geist', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg-0);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; }
  .pixel { font-family: 'Silkscreen', monospace; letter-spacing: 0.04em; }
  .mono { font-family: 'Geist Mono', monospace; }

  /* hide scrollbars in panels but keep functional */
  .scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script>
(async () => {
  const res = await fetch('app.js');
  const src = await res.text();
  const out = Babel.transform(src, { presets: ['react'] }).code;
  (new Function(out))();
})();
</script>
</body>
</html>
